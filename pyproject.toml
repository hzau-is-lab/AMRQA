[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amrqa"
version = "0.1.0"
description = "AMR-guided traceable multi-path reasoning for multi-hop question answering"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
]

[project.urls]
Repository = "https://github.com/hzau-is-lab/AMRQA"
Issues = "https://github.com/hzau-is-lab/AMRQA/issues"
Paper = "https://doi.org/10.1016/j.eswa.2026.134639"

[project.optional-dependencies]
llm = ["openai>=1.30"]
models = [
    "FlagEmbedding>=1.3.3",
    "sentence-transformers>=3.0",
]
amr = [
    "amrlib>=0.8.0",
    "penman>=1.3.1",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
amrqa = "amrqa.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
amrqa = ["assets/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP007", "UP045"]
